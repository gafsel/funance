# Deploy em push na main: só acontece depois que todos os jobs de
# verificação (Flutter, Cloud Functions e security rules) ficam verdes.
name: Deploy no Firebase ao integrar na main

'on':
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  FIREBASE_PROJECT_ID: funance-cef1b

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy_hosting:
    name: Deploy do Hosting
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O build web já foi feito no job `flutter` do workflow Verify.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUNANCE_CEF1B }}'
          channelId: live
          projectId: funance-cef1b

  deploy_backend:
    name: Deploy de Functions, rules (Firestore e Storage) e indexes
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependências das Functions
        working-directory: functions
        run: npm ci

      # O mesmo service account usado pelo deploy do Hosting é reaproveitado
      # aqui como credencial padrão do gcloud/Firebase CLI. Para que este job
      # funcione, esse service account precisa ter, além dos papéis criados
      # pelo `firebase init hosting:github` (Firebase Hosting Admin e API Keys
      # Viewer), os papéis: Cloud Functions Admin, Service Account User,
      # Firebase Rules Admin, Cloud Datastore Index Admin, Artifact Registry
      # Writer e Cloud Build Editor. Se preferir isolar as permissões, crie um
      # service account só para o backend, grave-o em um novo secret (ex.:
      # FIREBASE_SERVICE_ACCOUNT_DEPLOY_BACKEND) e troque a referência abaixo.
      - name: Gravar credenciais do service account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUNANCE_CEF1B }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_FUNANCE_CEF1B não configurado."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/service-account.json" >> "$GITHUB_ENV"

      - name: Deploy
        working-directory: functions
        run: |
          # `storage` (e não `storage:rules`) é o alvo válido do CLI para as
          # rules do Storage; `storage:<nome>` seria um deploy target de bucket.
          npx firebase deploy \
            --project "${FIREBASE_PROJECT_ID}" \
            --only functions,firestore:rules,firestore:indexes,storage \
            --non-interactive \
            --force

      - name: Remover credenciais
        if: always()
        run: rm -f "${RUNNER_TEMP}/service-account.json"
