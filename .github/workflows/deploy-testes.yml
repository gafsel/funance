# Deploy em push na main, SEMPRE no projeto de testes (funances2-testes), e só
# depois que todos os jobs de verificação (Flutter, Cloud Functions e security
# rules) ficam verdes.
#
# O projeto antigo (funance-cef1b) é a cópia de segurança do app atual e não é
# publicado pelo CI. Produção do Funances 2 terá um workflow próprio, manual.
name: Deploy no ambiente de testes ao integrar na main

'on':
  push:
    branches:
      - main

concurrency:
  group: deploy-testes
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  FIREBASE_PROJECT_ID: funances2-testes

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ambiente: testes

  deploy_hosting:
    name: Deploy do Hosting
    needs: verify
    runs-on: ubuntu-latest
    # O segredo FIREBASE_SERVICE_ACCOUNT vive no ambiente `testes` do GitHub.
    environment: testes
    steps:
      - uses: actions/checkout@v4

      # O build web já foi feito no job `flutter` do workflow Verify.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: funances2-testes

  deploy_backend:
    name: Deploy de Functions, rules (Firestore e Storage) e indexes
    needs: verify
    runs-on: ubuntu-latest
    # O segredo FIREBASE_SERVICE_ACCOUNT vive no ambiente `testes` do GitHub.
    environment: testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependências das Functions
        working-directory: functions
        run: npm ci

      # A conta de serviço do ambiente `testes` precisa, no projeto
      # funances2-testes, dos papéis: Firebase Hosting Admin, Cloud Functions
      # Admin, Service Account User, Firebase Rules Admin, Cloud Datastore
      # Index Admin, Artifact Registry Writer, Cloud Build Editor e Secret
      # Manager Viewer (o deploy confere que GEMINI_API_KEY existe).
      - name: Gravar credenciais do service account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT não configurado no ambiente testes."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/service-account.json" >> "$GITHUB_ENV"

      - name: Deploy
        working-directory: functions
        run: |
          # `storage` (e não `storage:rules`) é o alvo válido do CLI para as
          # rules do Storage; `storage:<nome>` seria um deploy target de bucket.
          npx firebase deploy \
            --project "${FIREBASE_PROJECT_ID}" \
            --only functions,firestore:rules,firestore:indexes,storage \
            --non-interactive \
            --force

      - name: Remover credenciais
        if: always()
        run: rm -f "${RUNNER_TEMP}/service-account.json"
