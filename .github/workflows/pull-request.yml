# CI de pull request: roda todos os jobs de verificação e, se passarem,
# publica um preview do Hosting no canal do PR, no projeto de testes.
name: CI e preview do Hosting no PR

'on': pull_request

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ambiente: testes

  build_and_preview:
    name: Preview do Hosting
    needs: verify
    # Forks não têm acesso aos secrets; o preview é pulado nesses casos
    # (os jobs de verificação continuam rodando normalmente).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: testes
    steps:
      - uses: actions/checkout@v4

      # O build web já foi feito no job `flutter` do workflow Verify.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: funances2-testes
