name: funances
description: "Funances: app de finanças pessoais gamificado com workspaces compartilhados, planejamento por categoria, controle de parcelas e faturas, e insights financeiros gerados por IA."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+2

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.3
  firebase_auth: ^5.5.3
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0

  # Estado e UI
  cupertino_icons: ^1.0.8

  # Utilitários
  uuid: ^4.5.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.6.1
  # Fica na linha 6.x: a 7.x reescreve a API de entrada (`initialize()` +
  # `authenticate()`) nas plataformas nativas, que é justamente onde este
  # pacote ainda usa o plugin — e onde não temos como verificar a troca.
  #
  # Na web ele NÃO participa mais do login (quem fala com o Google é o
  # `signInWithPopup` do Firebase Auth), mas o `google_sign_in_web` continua
  # sendo registrado pelo Flutter e ainda baixa o `gsi/client` em toda sessão.
  # É o preço de manter um único pacote para as outras plataformas: não há
  # como desregistrar a implementação web de um plugin federado sem remover o
  # plugin inteiro. São ~30 KB de um script do Google, sem efeito no login.
  google_sign_in: ^6.2.1
  go_router: ^14.7.2
  flutter_localizations:
    sdk: flutter
  # Só para `usePathUrlStrategy()`; entra por importação condicional e não
  # chega aos builds nativos.
  flutter_web_plugins:
    sdk: flutter
  fl_chart: ^1.2.0
  file_picker: ^8.0.3
  cloud_functions: ^5.6.2
  desktop_drop: ^0.7.1
  firebase_storage: ^12.4.10
  freezed_annotation: ^3.1.0
  smooth_page_indicator: ^2.0.1
  rxdart: ^0.28.0
  confetti: ^0.8.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.2
  flutter_notification_listener: ^1.4.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  flame: ^1.38.2
  google_fonts: ^8.2.1
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  json_serializable: ^6.9.3
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  # Controle de timers em teste (virada de meia-noite do todayProvider).
  # Já vinha transitivo pelo flutter_test; declarado para o analyzer.
  fake_async: ^1.3.3
  # `FirestoreMessageCodec`, o codec REAL por onde toda escrita do app passa.
  # É `const` e codifica sem canal de plataforma, então o teste exercita o
  # mesmo caminho que recusava as pendências com sugestão — e não uma
  # imitação. Vem transitivo pelo cloud_firestore; declarado para o analyzer.
  cloud_firestore_platform_interface: ^6.6.12

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/ios.png"
  # Os ícones da web são gerados à parte (cantos arredondados e versão de
  # notificação), junto com o favicon em SVG.
  web:
    generate: false
  image_path_android: "assets/icon/android.png"
  image_path_ios: "assets/icon/ios.png"
  image_path_macos: "assets/icon/ios.png"
  adaptive_icon_background: "#3CC7C4"
  adaptive_icon_foreground: "assets/icon/android.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo/
    - assets/logos/
    # POC da Arena: a folha de sprites Kenney (CC0) e a procedência dela.
    # Ver assets/arena/LICENSE.md.
    - assets/arena/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Fontes empacotadas (Fredoka display + Inter texto).
  #
  # Os .ttf em `assets/fonts/` são instâncias estáticas geradas a partir das
  # fontes variáveis oficiais do repositório `google/fonts` (OFL 1.1, licenças
  # em `assets/fonts/OFL-*.txt`), subconjuntadas para latino + latino estendido
  # + pontuação + símbolos de moeda. Ficam no binário de propósito: o app
  # precisa funcionar offline e o macOS em sandbox não busca fonte na rede.
  # Por isso NÃO usamos download em tempo de execução — nenhuma chamada a
  # fonts.gstatic.com acontece, em nenhuma plataforma.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
